<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2213%22 font-size=%2213%22%3E%F0%9F%8E%9B%3C/text%3E%3C/svg%3E">
<title>VES OPS — 운영 대시보드</title>
<!-- React 18 단일 파일 구성: 빌드 없이 esm.sh CDN 에서 ESM 으로 로드.
     이유: 배포가 'GitHub Pages 에 파일 하나 드래그'로 유지된다. 번들러 도입 시점에 그대로 이식 가능. -->
<style>
:root{--ground:#eef1f4;--panel:#fff;--side:#1e2833;--side-ink:#aebbc7;--side-on:#fff;
--ink:#232830;--ink2:#5c6570;--ink3:#8b939d;--line:#c9d0d8;--soft:#dde2e8;
--accent:#20586e;--accent-soft:#e3edf2;--ok:#1d7a46;--okbg:#e2f1e8;--warn:#a06008;--warnbg:#f7ecd8;--dotwarn:#f0ad00;
--bad:#a33131;--badbg:#f6e4e4;--mono:ui-monospace,"SF Mono",Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--ground:#15181c;--panel:#1f242a;--side:#11161b;--side-ink:#7e8a95;
--side-on:#e8edf2;--ink:#e3e7ec;--ink2:#9aa3ad;--ink3:#6d757f;--line:#3c434c;--soft:#2e343b;
--accent:#7db3c9;--accent-soft:#243440;--ok:#5cb884;--okbg:#22352b;--warn:#d9a458;--warnbg:#3a3222;--dotwarn:#eab84f;
--bad:#d97e7e;--badbg:#3c2727}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif}
.shell{display:flex;min-height:100vh}
aside{width:216px;flex-shrink:0;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand h1{font-size:16px;margin:0;color:var(--side-on)}.brand .v{font-family:var(--mono);font-size:10px;opacity:.65}
aside nav{display:flex;flex-direction:column;padding:10px 0}
aside nav a{display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;font-size:13.5px;color:var(--side-ink);text-decoration:none;border-left:3px solid transparent}
aside nav a:hover{color:var(--side-on);background:rgba(255,255,255,.04)}
aside nav a.on{color:var(--side-on);background:rgba(255,255,255,.07);border-left-color:#e8b04b;font-weight:600}
.cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:rgba(255,255,255,.1);padding:1px 7px;border-radius:10px}
.cnt.hot{background:var(--bad);color:#fff}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;line-height:1.8}
.hb-ok{color:#7ec89a}.hb-bad{color:#e08a8a}.hb-mut{opacity:.55}
main{flex:1;min-width:0;padding:0 26px 60px}
.page{max-width:1280px;margin:0 auto}
.topbar{display:flex;align-items:baseline;gap:14px;padding:22px 0 14px;flex-wrap:wrap}
.topbar h2{font-size:19px;margin:0}.topbar .sub{color:var(--ink2);font-size:13px}
.rfbtn{font:inherit;font-size:11.5px;padding:4px 12px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink2);cursor:pointer;margin-left:auto}
.rfbtn:hover{border-color:var(--accent);color:var(--ink)}.rfbtn:disabled{opacity:.55;cursor:default}
.datebox{font:inherit;font-size:11.5px;padding:3px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink2)}
.pastnote{background:var(--accent-soft);color:var(--accent);padding:8px 12px;font-size:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12px;border:1px solid var(--line);padding:3px 11px;border-radius:20px;color:var(--ink2);background:var(--panel);cursor:pointer;user-select:none;position:relative}
.tbadge{position:absolute;top:-8px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--soft)}
.thumb{aspect-ratio:16/9;background:#0003;display:block;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.nothumb{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(128,128,128,.14) 6px 7px)}
.thumb.nothumb::after{content:"썸네일 없음 · 비공개/삭제";font-size:10.5px;color:var(--ink3);text-align:center;padding:0 10px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1.5px 9px;border-radius:20px}
.pill.pub{background:var(--okbg);color:var(--ok)}.pill.unl{background:var(--warnbg);color:var(--warn)}
.pill.gone{background:var(--badbg);color:var(--bad)}.pill.na{background:var(--soft);color:var(--ink3)}
.thumb .pill{position:absolute;top:8px;left:8px}
/* 영상 피드 — 채널별 가로 스트립(2026-08-06 운영자 스케치) */
.chstrip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:14px;align-items:stretch;margin-bottom:12px}
.chside{width:118px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border-right:1px solid var(--soft);padding-right:12px}
.chside .chavatar{width:46px;height:46px}
.chside .chlink{flex-direction:column;gap:5px}
.chside .chlink span{white-space:normal;font-size:12.5px;font-weight:600;line-height:1.35}
.chside .nm{font-size:12.5px;font-weight:600;line-height:1.35;word-break:keep-all}
.chside .sub{font-size:10.5px;color:var(--ink3)}
.chrail{flex:1;min-width:0;overflow-x:auto;display:flex;gap:10px;padding-bottom:6px;scrollbar-width:thin}
.chrail::-webkit-scrollbar{height:8px}
.chrail::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.vtile{width:124px;flex:none;text-decoration:none;color:inherit;display:block}
.vtile .thumb{aspect-ratio:3/4;border-radius:8px;background:var(--ground)}
.vtile .pill{top:5px;left:5px;font-size:9.5px;padding:1px 6px}
.vtile .vt{font-size:11px;line-height:1.45;margin:5px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vtile .vd{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.vtile:hover .vt{text-decoration:underline}
.railempty{color:var(--ink3);font-size:12px;padding:18px 4px}
.vtile + .vtile{border-left:1px solid color-mix(in srgb, var(--soft) 55%, transparent);padding-left:10px}
/* 전체 탭 — 채널 구분 없이 최신순 격자, 카드마다 채널 아이콘·이름 (검수함 카드와 같은 방식) */
.fcard{background:var(--panel);border:1px solid var(--soft);border-radius:10px;overflow:hidden}
.fcard .thumb{aspect-ratio:3/4}
.fbody{padding:9px 10px}
.fbody .ft{font-size:12px;line-height:1.5;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fchan{display:flex;align-items:center;gap:7px;padding-top:7px;border-top:1px solid var(--soft)}
.fchan .chavatar{width:22px;height:22px}
.fchan .chlink span{font-size:12px;font-weight:600}
.fchan .when{margin-left:auto;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.card .body{padding:10px 12px 12px}
.card .title{font-size:12.5px;font-weight:600;line-height:1.4;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.card .meta{font-size:11px;color:var(--ink2);margin:0 0 8px}
.mac{font-family:var(--mono);font-size:10.5px;color:var(--accent)}
.lnk{font-size:11px;border:1px solid var(--line);padding:2px 8px;color:var(--ink2);text-decoration:none;margin-right:6px}
.panel{background:var(--panel);border:1px solid var(--soft);padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:14.5px}
.tblw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 12px;border-bottom:1px solid var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right}
tr.rowlink{cursor:pointer}tr.rowlink:hover td{background:var(--accent-soft)}
.bar{display:inline-block;height:8px;background:var(--accent);opacity:.75;vertical-align:middle}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:9px 13px;font-size:12.5px;color:var(--ink2);margin:0 0 16px}
.err{border-left-color:var(--bad);background:var(--badbg);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0 0 18px}
.kpi{background:var(--panel);border:1px solid var(--soft);padding:14px 16px}
.kpi .lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.kpi .val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .val small{font-size:13px;font-weight:400;color:var(--ink2)}
.kpi .hint{font-size:11.5px;color:var(--ink2)}
.kpi.bad{border-left:4px solid var(--bad)}.kpi.bad .val{color:var(--bad)}
.kpi.warn{border-left:4px solid var(--warn)}.kpi.warn .val{color:var(--warn)}
.kpi.ok{border-left:4px solid var(--ok)}
.two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
@media(max-width:980px){.two-col{grid-template-columns:1fr}}
.queue-row{display:flex;gap:12px;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--soft)}
.queue-row:last-child{border-bottom:none}
.brake{font-family:var(--mono);font-size:10px;color:var(--bad);background:var(--badbg);padding:2px 6px;white-space:nowrap}
.gauge{font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap}
.mac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.mac-card{background:var(--panel);border:1px solid var(--soft);padding:14px 16px}
.mac-card h4{margin:0 0 2px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mac-card .role{font-size:11.5px;color:var(--ink3);margin:0 0 10px}
.runline{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-top:1px dashed var(--soft);gap:10px}
.st{font-weight:600;white-space:nowrap}
.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}.st.skip{color:var(--ink3)}.st.warn{color:var(--warn)}
.logtail{font-family:var(--mono);font-size:10px;color:var(--ink2);background:var(--ground);border:1px dashed var(--line);padding:8px 10px;margin-top:10px;overflow-x:auto;white-space:pre-wrap;max-height:200px;overflow-y:auto}
.sha{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.sync{font-weight:700}.sync.ok{color:var(--ok)}.sync.old{color:var(--bad)}
.commit{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--soft);align-items:baseline}
.commit .when{margin-left:auto;color:var(--ink3);font-size:11.5px;flex-shrink:0;white-space:nowrap}
.commit .msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#login-wrap{position:fixed;inset:0;background:var(--ground);display:flex;align-items:center;justify-content:center;z-index:9}
#login-wrap .box{background:var(--panel);border:1px solid var(--soft);padding:28px;width:320px}
#login-wrap h1{font-size:17px;margin:0 0 4px}#login-wrap p{font-size:12.5px;color:var(--ink2);margin:0 0 14px}
#login-wrap input{width:100%;padding:9px 11px;font:inherit;border:1px solid var(--line);background:var(--ground);color:var(--ink);margin-bottom:10px}
#login-wrap button{width:100%;padding:9px;font:inherit;font-weight:600;background:var(--accent);color:#fff;border:none;cursor:pointer}
#login-wrap .msg{font-size:12px;color:var(--bad);min-height:16px;margin-top:8px}
.skel{color:var(--ink3);font-size:13px;padding:20px 0}
details.tail summary{cursor:pointer;font-size:11.5px;color:var(--ink2)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.rcard{background:var(--panel);border:1px solid var(--soft);display:flex;flex-direction:column}
.rchan{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.rchan .chavatar{width:24px;height:24px}
.rchan .mac{margin-left:auto}
.player{aspect-ratio:9/16;max-height:340px;background:#000;display:flex;align-items:center;justify-content:center}
.player video{width:100%;height:100%;object-fit:contain}
.player .skel{color:#888}
.rbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.rtitle{font-size:13px;font-weight:600;line-height:1.4;margin:0}
.rmeta{font-size:11.5px;color:var(--ink2);line-height:1.7;font-variant-numeric:tabular-nums}
.rmeta .k{color:var(--ink3)}
.acts{display:flex;gap:8px;margin-top:auto}
.btn{flex:1;padding:8px;font:inherit;font-size:13px;font-weight:600;border:1px solid;cursor:pointer;background:var(--panel)}
.btn.pass{border-color:var(--ok);color:var(--ok)}.btn.pass:hover{background:var(--okbg)}
.btn.rej{border-color:var(--bad);color:var(--bad)}.btn.rej:hover{background:var(--badbg)}
.btn:disabled{opacity:.5;cursor:wait}
.reason{width:100%;padding:6px 9px;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--ground);color:var(--ink)}
.decided-row{padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.drow-head{display:flex;gap:8px;align-items:baseline;min-width:0}
.drow-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow-sub{color:var(--ink3);font-size:11px}
.drow-when{flex:none;color:var(--ink3);font-size:11px}
.drow-body{display:flex;gap:10px;margin-top:8px;align-items:flex-start}
.drow-author{width:58px;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:1px;font-size:10.5px;color:var(--ink3);text-align:center;word-break:keep-all}
.drow-note{position:relative;margin:2px 0 3px 4px;padding:8px 13px;background:var(--ground);border:1px solid var(--line);border-radius:10px;color:var(--ink2);font-size:11.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;max-width:720px;width:fit-content;flex:0 1 auto}
.drow-note::before{content:"";position:absolute;bottom:9px;left:-6px;width:10px;height:10px;background:var(--ground);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.drow-note.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.drow-note.ok::before{background:var(--okbg);border-color:var(--ok)}
.face{display:block;border-radius:50%}
.avpick{position:relative;display:flex;align-items:center}
.avbtn{border:1px solid var(--line);background:var(--panel);border-radius:50%;padding:2px;cursor:pointer;display:flex}
.avbtn:hover{border-color:var(--accent)}
.avpop{position:absolute;top:36px;right:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;box-shadow:0 6px 22px rgba(0,0,0,.18)}
.avopt{border:2px solid transparent;background:none;border-radius:50%;padding:2px;cursor:pointer;display:flex}
.avopt:hover{border-color:var(--line)}.avopt.on{border-color:var(--accent)}
.editnote{border:none;background:none;color:var(--ink3);cursor:pointer;font:inherit;font-size:11px;padding:0 2px;flex:none}
.editnote:hover{color:var(--accent);text-decoration:underline}
.noteedit{font:inherit;font-size:11.5px;line-height:1.6;padding:8px 10px;border:1px solid var(--accent);background:var(--panel);color:var(--ink);border-radius:8px;min-height:58px;width:100%;max-width:700px;resize:vertical}
.notebtns{display:flex;gap:6px;margin-top:5px}
.notehint{margin:6px 2px 0;font-size:11.5px;line-height:1.6;color:var(--warn)}
.decided-row:last-child{border-bottom:none}
.dpill{font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px}
.dpill.approved{background:var(--okbg);color:var(--ok)}.dpill.rejected{background:var(--badbg);color:var(--bad)}
.namebox{padding:5px 9px;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:130px}
.judgebox{font-size:11.5px;color:var(--ink2);background:var(--ground);border:1px dashed var(--line);padding:8px 10px;line-height:1.7}
.judgebox .q{font-weight:600;color:var(--ink)}
.judgebox details{margin-top:4px}.judgebox summary{cursor:pointer;color:var(--ink3);font-size:11px}
.hallu{background:var(--badbg);color:var(--bad);border:1px solid var(--bad);padding:6px 9px;font-size:11.5px;font-weight:600}
/* 홈: 6대 상태 보드 */
.boardlegend{display:flex;gap:14px;align-items:center;font-size:11.5px;color:var(--ink2);margin:2px 0 8px;flex-wrap:wrap}
.boardlegend .lg{display:flex;gap:5px;align-items:center}
.macboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:10px;margin-bottom:12px}
.macbox{background:var(--panel);border:1px solid var(--line);padding:10px 12px;cursor:pointer;user-select:none}
.macbox:hover{border-color:var(--accent)}
.macbox.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.macbox h4{margin:0 0 6px;font-size:13px}.macbox h4 small{color:var(--ink3);font-weight:400}
.chrow{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12.5px;min-width:0}
.chhead{justify-content:flex-end;gap:17px;color:var(--ink2);font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:0 0 3px}
.chhead span{width:11px;text-align:center;overflow:visible;white-space:nowrap}
.lghelp{position:relative;margin-left:2px;color:var(--ink3);cursor:help;display:flex;align-items:center}
.lgpop{position:absolute;top:20px;left:0;z-index:25;width:290px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11.5px;line-height:1.75;color:var(--ink2);box-shadow:0 6px 22px rgba(0,0,0,.16);cursor:auto;text-align:left}
.lgpop b{color:var(--ink)}
.dotpair{display:flex;gap:17px;margin-left:auto;flex:none}
.chdot{width:11px;height:11px;border-radius:50%;flex:none}
.chdot.ok{background:var(--ok)}.chdot.warn{background:var(--dotwarn,var(--warn))}.chdot.bad{background:var(--bad)}.chdot.idle{background:var(--line)}
.chdot.rej{background:transparent;border:3px solid var(--bad)}
/* 링 = 재생성 사이클을 거친 상태(첫 시도 실패 후 다시 만든 것) */
.chdot.warnr{background:transparent;border:3px solid var(--dotwarn,var(--warn))}
.chdot.okr{background:transparent;border:3px solid var(--ok)}
.chdot.hold{background:transparent;border:3px solid var(--line)}
.chlink{display:flex;align-items:center;gap:6px;color:inherit;text-decoration:none;min-width:0}
.chlink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.chlink:hover span{text-decoration:underline}
.chavatar{width:18px;height:18px;border-radius:50%;flex:none;background:var(--ground)}
.drill{background:var(--panel);border:1px solid var(--line);padding:12px 14px;margin-bottom:12px}
.drill h4{margin:0 0 4px;font-size:13px}.drill h4 small{color:var(--ink3);font-weight:400}
.drillrow{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;align-items:flex-start}

</style></head><body>
<div id="root"><div class="skel" style="padding:40px">불러오는 중…</div></div>
<script type="module">
import React, { useState, useEffect, useMemo, useCallback } from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
import htm from "https://esm.sh/htm@3.1.1";
const html = htm.bind(React.createElement);

const BASE = "https://fdidiqdhcyctdbogxkdu.supabase.co/functions/v1/dashboard";
const KEY = () => localStorage.getItem("ves_key") || "";
const fmt = (n) => n == null ? "—" : Number(n).toLocaleString("ko-KR");
const pct = (n) => n == null ? "—" : Number(n).toFixed(1);
const shortSha = (s) => (s || "").slice(0, 7) || "—";
const ago = (iso, now) => {
  if (!iso) return "무보고";
  const h = (new Date(now || Date.now()) - new Date(iso)) / 36e5;
  if (h < 1) return `${Math.round(h * 60)}분 전`;
  if (h < 48) return `${Math.round(h)}시간 전`;
  return `${Math.round(h / 24)}일 전`;
};
const fmtDT = (iso) => {  // 로컬(한국) 시각 MM-DD HH:mm — UTC 문자열 slice 는 9시간 어긋난다(2026-08-05 발견)
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return String(iso).slice(5, 16).replace("T", " ");
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const PILL = { public: ["pub", "공개"], unlisted: ["unl", "일부공개"], private: ["gone", "비공개"], gone: ["gone", "반려/삭제"] };
const RESULT = {
  generated: ["✓ 생성", "ok"], paused_pending: ["⏸ 대기 가득 — 검수 필요", "warn"],
  waiting_source: ["… 소스 대기", "skip"], failed: ["✗ 실패", "bad"], skipped: ["– 건너뜀", "skip"],
};
const ERR_LABEL = { llm_json: "AI응답 파싱", api_quota: "API 쿼터", env_config: "환경설정", source_missing: "소스 없음", video_id_mismatch: "소스 불일치", code_bug: "코드 버그", unknown: "미분류" };

async function api(path) {
  const r = await fetch(BASE + path, { headers: { "x-ves-key": encodeURIComponent(KEY()) } });
  if (r.status === 401) throw new Error("unauthorized");
  if (r.status === 503) { const b = await r.json(); if (b.setup) throw new Error("setup"); }
  return r.json();
}

function Login({ onOk, initialMsg }) {
  const [pw, setPw] = useState(""); const [msg, setMsg] = useState(initialMsg || "");
  const go = async () => {
    localStorage.setItem("ves_key", pw.trim());
    try { await api("/api/feed?days=1"); onOk(); }
    catch (e) {
      setMsg(e.message === "unauthorized" ? "코드가 틀렸거나 만료됐습니다."
        : e.message === "setup" ? "서버에 DASHBOARD_PASSWORD 시크릿이 설정되지 않았습니다."
        : "접속 실패: " + e.message);
    }
  };
  return html`<div id="login-wrap"><div class="box">
    <h1>VES OPS</h1><p>팀 접속 코드를 입력하세요.</p>
    <input type="password" placeholder="접속 코드" autoComplete="current-password"
      value=${pw} onChange=${(e) => setPw(e.target.value)} onKeyDown=${(e) => e.key === "Enter" && go()} />
    <button onClick=${go}>들어가기</button><div class="msg">${msg}</div>
  </div></div>`;
}

function StatusPill({ st }) {
  const [cls, label] = (st && PILL[st.privacy]) || ["na", "상태 미확인"];
  return html`<span class=${"pill " + cls}>${label}</span>`;
}

// ── 홈 · 검수함 ──
// ── 공통: 페이지 데이터 새로고침 버튼 (사이트 리로드 없이 API 만 다시) ──
// ── 검수자 프로필 얼굴 (0012) — 연한 파스텔 + 은은한 선. 표시 전용, id 만 DB 에 저장 ──
const FACES = [
  ["smile",   "#F4E7E9"], ["beam",  "#E8F0E4"], ["wink",   "#E4EDF6"], ["calm",   "#F6F0DF"],
  ["surprise","#EDE7F5"], ["sleepy","#E2F0EC"], ["grin",   "#F6EAE1"], ["shy",    "#EFEDEA"],
  ["smirk",   "#E5F0F6"], ["gentle","#EFF3DF"],
];
const FACE_BG = Object.fromEntries(FACES);
function Face({ id, size = 30 }) {
  const bg = FACE_BG[id] || FACES[0][1];
  const ink = "#7d786e";
  const dot = (cx, cy) => html`<circle cx=${cx} cy=${cy} r="1.5" fill=${ink} />`;
  const feat = {
    smile: html`${dot(11.5, 13.5)}${dot(20.5, 13.5)}<path d="M11.5 19.5 Q16 23 20.5 19.5" />`,
    beam: html`<path d="M9.5 14 Q11.5 11.5 13.5 14" /><path d="M18.5 14 Q20.5 11.5 22.5 14" /><path d="M12 19.5 Q16 22.5 20 19.5" />`,
    wink: html`${dot(11.5, 13.5)}<path d="M18.5 13.5 h4" /><path d="M11.5 19.5 Q16 23 20.5 19.5" />`,
    calm: html`${dot(11.5, 13.5)}${dot(20.5, 13.5)}<path d="M12.5 20 h7" />`,
    surprise: html`${dot(11.5, 13)}${dot(20.5, 13)}<circle cx="16" cy="20" r="2.2" />`,
    sleepy: html`<path d="M10 13.5 h4" /><path d="M18 13.5 h4" /><path d="M14 20 Q16 21.5 18 20" />`,
    grin: html`${dot(11.5, 13.5)}${dot(20.5, 13.5)}<path d="M10.5 18.5 Q16 24.5 21.5 18.5" />`,
    shy: html`${dot(11.5, 13.5)}${dot(20.5, 13.5)}<path d="M13.5 20 Q16 21.8 18.5 20" /><circle cx="8.8" cy="17.5" r="1.6" fill="#EBC9CE" stroke="none" /><circle cx="23.2" cy="17.5" r="1.6" fill="#EBC9CE" stroke="none" />`,
    smirk: html`${dot(11.5, 13.5)}${dot(20.5, 13.5)}<path d="M12 20 Q17 22.5 20.5 18.8" />`,
    gentle: html`<path d="M9.5 13 Q11.5 15 13.5 13" /><path d="M18.5 13 Q20.5 15 22.5 13" /><path d="M12 19 Q16 22 20 19" />`,
  };
  return html`<svg class="face" width=${size} height=${size} viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="15" fill=${bg} stroke="rgba(0,0,0,.07)" />
    <g stroke=${ink} stroke-width="1.6" stroke-linecap="round" fill="none">${feat[id] || feat.smile}</g>
  </svg>`;
}
// 아이콘 미저장 결정(과거분·타인)은 이름 해시로 고정 배정 — 모든 뷰어에게 같은 얼굴
function faceOf(decision) {
  if (decision.reviewer_icon && FACE_BG[decision.reviewer_icon]) return decision.reviewer_icon;
  const s = decision.decided_by || "?";
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return FACES[h % FACES.length][0];
}

function RefreshBtn({ onRefresh }) {
  const [busy, setBusy] = useState(false);
  return html`<button class="rfbtn" disabled=${busy} onClick=${async () => {
    setBusy(true);
    try { await onRefresh(); } finally { setBusy(false); }
  }}>${busy ? "⟳ 갱신 중…" : "⟳ 새로고침"}</button>`;
}

// ── 홈: 채널 칩 (아이콘 + 이름 → 유튜브 채널로 이동) ──
function ChannelChip({ name, chmap, avatars }) {
  const id = chmap?.[name]?.id;
  const av = id ? avatars?.[id] : null;
  const inner = html`${av ? html`<img class="chavatar" src=${av} referrerpolicy="no-referrer" loading="lazy" />`
    : html`<span class="chavatar"></span>`}<span>${name}</span>`;
  return id
    ? html`<a class="chlink" href=${"https://www.youtube.com/channel/" + id} target="_blank" rel="noopener"
        onClick=${(e) => e.stopPropagation()}>${inner}</a>`
    : html`<span class="chlink">${inner}</span>`;
}

// 점 툴팁 — 범례를 짧게 줄인 대신 정확한 뜻은 여기서(2026-08-06 운영자 합의)
const GEN_TIP = { ok: "검수 통과", warn: "검수 대기", rej: "반려 (대체 장면 생성 예정)",
  bad: "생성 실패", okr: "재생성 후 검수 통과", warnr: "재생성 후 검수 대기",
  hold: "재생성 반복했지만 전부 중복 — 보류 (소재 소진 의심)", idle: "오늘 신호 없음" };
const PUB_TIP = { ok: "오늘 공개됨", warn: "공개 전환 대기 (Studio)", idle: "오늘 공개 없음" };

// ── 홈: 6대 상태 보드 + 드릴다운 ──
// 점 규칙: **오늘 일어난 일만** 반영한다(운영자 규칙 2026-08-05 — "신호등은 무조건 오늘 기준").
// 채널당 점 2개 — 하나로는 "오늘 몫은 예약으로 채웠지만 오늘 생성은 실패"(2026-08-05 이불 속
// 극장 실사례)를 표현할 수 없다:
//   생성(공급): 오늘 파이프라인이 새 영상을 만들었나 — 실패 > 검수 대기 > 반려 > 합격 > 없음
//   공개(배포): 오늘 이 채널에 1편 공개가 나갔나 — 오늘 공개 확인(초록) > 전환 대기(노랑) > 없음
// 예약공개는 API 로 미리 안 보인다(비공개와 동일) — 실제 공개되는 순간 publishedAt 으로 잡힌다.
// 지난 이력은 드릴다운(시각 표기)이 담당 — 어제의 초록이 오늘의 문제를 가리면 안 된다.
// 드릴다운은 카드 클릭 토글이되, 실패가 있는 맥은 자동으로 펼친다(문제가 먼저 보이게).
function MacBoard({ machines, queue, review, chmap, avatars, yt, feed, dateCtl, failures, holds }) {
  const [manual, setManual] = useState({});   // machine_id → 수동 열림/닫힘 (자동값 덮어씀)
  const [help, setHelp] = useState(false);   // 범례 ⓘ — 긴 설명은 여기로 접었다(2026-08-06)
  // accepted_at(맥 로컬시각, 오프셋 없음)과 created_at(UTC 오프셋 포함)이 섞인다 —
  // Date 파싱이 둘 다 브라우저 로컬(KST)로 맞춰주므로 날짜 비교는 toDateString 으로.
  const isToday = (iso) => {
    if (!iso) return false;
    const d = new Date(iso);
    return !isNaN(d) && d.toDateString() === new Date().toDateString();
  };
  // 실패는 "언제" 가 중요하다 — 그 뒤 재생성이 성공했으면 실패가 최종 상태가 아니다.
  // 서버가 오늘 **전 비트**에서 모아준 맵을 쓴다 — machines[].beat(머신당 최신 1건)만 보면
  // 재생성 실행이 새 비트를 남기는 순간 새벽 실패가 사라진다(2026-08-06 실측).
  const failedAt = failures ?? {};
  const holdAt = holds ?? {};   // 3회 전부 중복 → 보류(dup_hold). 실패보다 약하지만 사람이 봐야 한다
  const badAt = (ch) => {
    const f = failedAt[ch], h = holdAt[ch];
    return !f ? h : !h ? f : (String(f) > String(h) ? f : h);
  };
  const badKind = (ch) => (badAt(ch) === failedAt[ch] ? "bad" : "hold");
  const failed = { has: (ch) => !!badAt(ch) };
  const pend = {}, dec = {}, waitPublic = {};
  for (const i of review?.queue ?? []) (pend[i.channel] ??= []).push(i);
  for (const i of review?.decided ?? []) (dec[i.channel] ??= []).push(i);
  for (const q of queue) {
    if (!q.video_id || q.stale || q.unknown) continue;
    // 발행 이력이라도 실제 공개 상태를 본다 — 구 흐름(일부공개 업로드 후 사람이 공개 전환)의
    // 미전환분을 초록으로 칠하면 밀린 일이 숨는다(2026-08-05 운영자 발견: 여운 보관소).
    const p = yt?.[q.video_id]?.privacy;
    if (p && p !== "public" && p !== "gone") (waitPublic[q.channel] ??= []).push(q);
  }
  for (const ch of Object.keys(dec)) dec[ch].sort((a, b) => (b.decision.decided_at || "").localeCompare(a.decision.decided_at || ""));
  // 발행 이력의 정본은 피드(clips.published_at, DB 영구 기록) — 하트비트 스냅샷은 다음 비트에
  // 갱신되며 지난 기록이 빠진다(2026-08-05 맥4 실측). 드릴다운에는 최근 7일: 하루 1편 리듬에서
  // 채널당 ≤7줄로 카드가 안 터지고, 회차 하나(장면 3개 ≈ 3일)의 생애를 항상 통째로 담는다.
  const PUB_WINDOW_DAYS = 7;
  const pubWin = {}, pubToday = {};
  for (const f of feed ?? []) {
    if (!f.channel || !f.video_id || !f.published_at) continue;
    const age = Date.now() - new Date(f.published_at).getTime();
    if (!isNaN(age) && age < PUB_WINDOW_DAYS * 864e5) (pubWin[f.channel] ??= []).push(f);
    if (isToday(f.published_at)) (pubToday[f.channel] ??= []).push(f);
  }
  const todayDec = (ch) => (dec[ch] ?? []).find((i) => isToday(i.decision.decided_at));
  // 실패 뒤에 온 신호인가 — 재생성분(그 뒤 적재된 클립·그 뒤 내려진 결정)이면 true.
  const after = (ch, iso) => {
    const f = badAt(ch);
    return !f || (iso && new Date(iso) > new Date(f));
  };
  // 생성 점: 실패가 최신이면 빨강(solid). 실패 뒤 재생성분이 있으면 그 결과를 **링**으로 —
  // "실패했지만 다시 만들어 진행 중/통과" 를 한 점에 담는다(2026-08-06 운영자 제안).
  const genStatus = (ch) => {
    const d = todayDec(ch);
    const waiting = (pend[ch] ?? []).filter((i) => isToday(i.created_at));
    const decOk = d?.decision.decision === "approved" || (pubToday[ch] ?? []).length;
    const decRej = d?.decision.decision === "rejected";
    if (!failed.has(ch)) {
      return waiting.length ? "warn" : decRej ? "rej" : decOk ? "ok" : "idle";
    }
    // 실패 이력 있음 — 그 뒤 신호를 찾는다
    if (waiting.some((i) => after(ch, i.created_at))) return "warnr";   // 재생성 → 검수 대기
    if (d && after(ch, d.decision.decided_at)) return d.decision.decision === "approved" ? "okr" : "rej";
    if ((pubToday[ch] ?? []).some((f) => after(ch, f.published_at))) return "okr";
    return badKind(ch);                                                 // 실패/보류가 마지막 소식
  };
  const chVids = {};  // 채널 → 아는 video_id 전부 (피드 + 스냅샷)
  for (const f of feed ?? []) if (f.channel && f.video_id) (chVids[f.channel] ??= new Set()).add(f.video_id);
  for (const q of queue) if (q.channel && q.video_id) (chVids[q.channel] ??= new Set()).add(q.video_id);
  const pubStatus = (ch) => {
    for (const v of chVids[ch] ?? []) {
      const s = yt?.[v];
      if (s?.privacy === "public" && isToday(s.published_at)) return "ok";
    }
    return waitPublic[ch]?.length ? "warn" : "idle";
  };
  const statusOf = genStatus;  // 자동 펼침 등 기존 소비자용 별칭
  const chansOf = (mac) => Object.keys(chmap || {}).filter((c) => chmap[c].mac === mac);
  // 항목은 하루치가 아니라 누적 — 대기는 결정까지, 결정은 최근 2건, 발행은 회차 진행 중 유지.
  // 그래서 줄마다 생성 시각(발행분은 장면 확정 시각)을 왼쪽에 붙인다(2026-08-05 운영자 요청).
  const rowsOf = (ch, m) => {
    const items = [];
    if (failed.has(ch)) {
      const g = genStatus(ch);
      items.push([g.endsWith("r") || g === "hold" ? "warn" : "bad",
        g.endsWith("r") ? "생성 실패 → 재생성함 (다음 항목이 재생성분)"
          : badKind(ch) === "hold" ? "재생성 반복했지만 전부 중복 → 보류 (소재 소진 의심 — 회차 전진 검토)"
          : "최근 생성 실패 — 상세는 '머신 로그' 탭", null, badAt(ch)]);
    }
    for (const i of pend[ch] ?? []) items.push(["warn",
      `${i.work || "?"}${i.episode != null ? " " + i.episode + "회차" : ""} — 검수 대기` +
      (i.judge?.quality_score != null ? ` (judge ${Number(i.judge.quality_score).toFixed(2)})` : ""), null, i.created_at]);
    for (const i of (dec[ch] ?? []).slice(0, 2)) {
      const d = i.decision;
      items.push([d.decision === "approved" ? "ok" : "bad",
        `${i.work || "?"}${i.episode != null ? " " + i.episode + "회차" : ""} — ` +
        (d.decision === "approved" ? (i.published ? "합격 · 발행됨" : "합격 · 발행 대기")
          : (d.reject_type === "production" ? "반려 · 제작 (같은 구간 재시도 예정)" : "반려 · 장면 (대체 장면 생성 예정)")), null, i.created_at]);
    }
    for (const q of waitPublic[ch] ?? []) items.push(["warn",
      `${q.work || "?"}${q.episode != null ? " " + q.episode + "회차" : ""} — 공개 전환 대기 (${q.privacy_at_publish || "일부공개"})`, q.video_id, q.accepted_at]);
    for (const f of pubWin[ch] ?? []) items.push(["ok",
      `${f.work || "?"}${f.episode_no != null ? " " + f.episode_no + "회차" : ""} — 발행됨`, f.video_id, f.published_at]);
    if (!items.length) items.push(["skip", "최근 신호 없음", null, null]);
    items.sort((a, b) => String(b[3] || "").localeCompare(String(a[3] || "")));  // 최신이 위로
    return items;
  };
  const hasBad = (m) => chansOf(m.mac).some((c) => statusOf(c) === "bad");  // 자동 펼침은 생성 실패만(반려는 정상 흐름)
  const isOpen = (m) => manual[m.machine_id] ?? hasBad(m);
  const toggle = (m) => setManual((p) => ({ ...p, [m.machine_id]: !isOpen(m) }));
  return html`<div>
    <div class="boardlegend">
      ${dateCtl}
      <span class="lg"><span class="chdot ok"></span>완료</span>
      <span class="lg"><span class="chdot warn"></span>대기</span>
      <span class="lg"><span class="chdot rej"></span>반려</span>
      <span class="lg"><span class="chdot bad"></span>실패</span>
      <span class="lg"><span class="chdot idle"></span>없음</span>
      <span style=${{ color: "var(--ink3)" }}>○ 링 = 재생성 후</span>
      <span class="lghelp" onMouseEnter=${() => setHelp(true)} onMouseLeave=${() => setHelp(false)}
        onClick=${(e) => { e.stopPropagation(); setHelp(!help); }} title="신호등 읽는 법">ⓘ
        ${help ? html`<div class="lgpop">
          <b>색</b>은 그 단계의 상태 — 두 열에서 뜻이 같습니다.<br/>
          <b>어느 단계</b>인지는 카드의 <b>생성 · 공개</b> 머리글이 알려줍니다.<br/>
          예: 생성 열 초록 = 검수 통과, 공개 열 초록 = 오늘 공개됨<br/>
          <b>회색</b>은 오늘 그 단계에서 아무 신호가 없었다는 뜻입니다.<br/>
          <b>회색 링</b>은 재생성을 반복했지만 전부 중복이라 보류된 상태입니다.<br/>
          <span style=${{ color: "var(--ink3)" }}>· 기준은 항상 오늘 — 예약공개는 공개되는 순간 반영</span><br/>
          <span style=${{ color: "var(--ink3)" }}>· 카드를 누르면 상세, 실패가 있는 맥은 자동으로 펼쳐집니다</span>
        </div>` : null}
      </span>
    </div>
    <div class="macboard">
      ${machines.map((m) => html`<div key=${m.machine_id} class=${"macbox" + (isOpen(m) ? " sel" : "")} onClick=${() => toggle(m)}>
        <h4>${m.mac} <small>· ${m.label}</small>${hasBad(m) ? html`<span class="st bad"> ⛔</span>` : ""}</h4>
        ${chansOf(m.mac).length ? html`<div class="chrow chhead"><span>생성</span><span>공개</span></div>` : null}
        ${chansOf(m.mac).map((ch) => html`<div class="chrow" key=${ch}>
          <${ChannelChip} name=${ch} chmap=${chmap} avatars=${avatars} />
          <span class="dotpair"><span class=${"chdot " + genStatus(ch)} title=${"생성 — " + GEN_TIP[genStatus(ch)]}></span>
            <span class=${"chdot " + pubStatus(ch)} title=${"공개 — " + PUB_TIP[pubStatus(ch)]}></span></span></div>`)}
        ${chansOf(m.mac).length === 0 ? html`<div class="chrow" style=${{ color: "var(--ink3)" }}>담당 채널 없음</div>` : null}
      </div>`)}
    </div>
    ${machines.filter(isOpen).map((m) => html`<div class="drill" key=${m.machine_id}>
      <h4>${m.mac} <small>· ${m.label} — 작품·회차별 현황</small></h4>
      ${chansOf(m.mac).map((ch) => html`<div class="drillrow" key=${ch}>
        <div class="drillch"><${ChannelChip} name=${ch} chmap=${chmap} avatars=${avatars} /></div>
        <div class="drillitems">${rowsOf(ch, m).map(([cls, text, vid, t], i) => html`
          <div key=${i} class="ditem"><span class="dtime">${fmtDT(t)}</span>
            <span class=${"st " + cls} style=${{ fontWeight: 400 }}>${text}
            ${vid ? html` <a class="lnk" target="_blank" rel="noopener"
              href=${"https://youtu.be/" + vid}>▶ 영상</a>` : null}</span></div>`)}</div>
      </div>`)}
    </div>`)}
  </div>`;
}

// ── 홈: 과거 날짜 보드 — 일일 마감 스냅샷(23:55 저장분)을 그대로 렌더. 재계산 없음. ──
function PastBoard({ snap, chmap, avatars }) {
  const b = snap.board || {};
  const chansOf = (mac) => Object.keys(b).filter((c) => b[c].mac === mac);
  return html`<div>
    <div class="macboard">
      ${(snap.machines || []).map((m) => html`<div key=${m.mac} class="macbox" style=${{ cursor: "default" }}>
        <h4>${m.mac} <small>· ${m.label}</small></h4>
        ${chansOf(m.mac).length ? html`<div class="chrow chhead"><span>생성</span><span>공개</span></div>` : null}
        ${chansOf(m.mac).map((ch) => html`<div class="chrow" key=${ch}>
          <${ChannelChip} name=${ch} chmap=${chmap} avatars=${avatars} />
          <span class="dotpair"><span class=${"chdot " + b[ch].gen} title=${"생성 — " + (GEN_TIP[b[ch].gen] || "")}></span>
            <span class=${"chdot " + b[ch].pub} title=${"공개 — " + (PUB_TIP[b[ch].pub] || "")}></span></span></div>`)}
        ${chansOf(m.mac).length === 0 ? html`<div class="chrow" style=${{ color: "var(--ink3)" }}>담당 채널 없음</div>` : null}
      </div>`)}
    </div>
    ${(snap.machines || []).filter((m) => chansOf(m.mac).some((c) => (b[c].rows || []).length)).map((m) => html`
      <div class="drill" key=${m.mac}>
        <h4>${m.mac} <small>· ${m.label} — 그날 기록</small></h4>
        ${chansOf(m.mac).filter((ch) => (b[ch].rows || []).length).map((ch) => html`<div class="drillrow" key=${ch}>
          <div class="drillch"><${ChannelChip} name=${ch} chmap=${chmap} avatars=${avatars} /></div>
          <div class="drillitems">${b[ch].rows.map(([cls, text, vid, t], i) => html`
            <div key=${i} class="ditem"><span class="dtime">${fmtDT(t)}</span>
              <span class=${"st " + cls} style=${{ fontWeight: 400 }}>${text}
              ${vid ? html` <a class="lnk" target="_blank" rel="noopener"
                href=${"https://youtu.be/" + vid}>▶ 영상</a>` : null}</span></div>`)}</div>
        </div>`)}
      </div>`)}
  </div>`;
}

function HomePage({ machines, queue, yt, now, review, chmap, avatars, feed, refresh, failures, holds }) {
  // 검수 대기 = 검수함 큐(review_decisions 기준) — 스냅샷의 미발행 장면 수로 세면 결정이
  // 나도 발행 전까지 계속 '대기'로 남는다(2026-08-05 운영자 발견: 검수 끝냈는데 9건 표시).
  // 공개 전환 대기(구 흐름 일부공개 잔량)만 스냅샷 × YouTube 상태로 센다.
  // 캘린더 과거 보기 — 오늘이면 라이브, 과거면 그날 마감 스냅샷(23:55 저장분)
  const todayStr = (() => { const d = new Date(); const z = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; })();
  const [selDate, setSelDate] = useState(todayStr);
  const [snap, setSnap] = useState(null);
  const [snapState, setSnapState] = useState("live"); // live | loading | ok | none
  useEffect(() => {
    if (selDate >= todayStr) { setSnapState("live"); setSnap(null); return; }
    setSnapState("loading");
    api("/api/snapshot?date=" + selDate)
      .then((d) => { if (d.payload) { setSnap(d.payload); setSnapState("ok"); } else setSnapState("none"); })
      .catch(() => setSnapState("none"));
  }, [selDate]);
  // 보드를 지배하는 컨트롤이라 상단바가 아니라 보드 범례 맨 왼쪽에 둔다(2026-08-05 운영자)
  const dateCtl = html`<input type="date" class="datebox" max=${todayStr} value=${selDate}
    title="과거 날짜의 마감 기록 보기" onChange=${(e) => setSelDate(e.target.value || todayStr)} />`;
  const rq = review?.queue ?? [];
  const needPublic = queue.filter((q) => !q.stale && !q.unknown && q.video_id
    && yt[q.video_id] && !["public", "gone"].includes(yt[q.video_id].privacy));
  const braked = machines.flatMap((m) => (m.beat?.channels ?? []).filter((c) => c.result === "paused_pending").map((c) => ({ ...c, mac: m.mac })));
  const failed = Object.keys(failures ?? {}).map((channel) => ({ channel }));  // 오늘 전 비트 기준
  const holdList = Object.keys(holds ?? {});
  const beatsOk = machines.filter((m) => m.beat).length;
  // 채널×회차로 묶기 — 검수 대기(검수함 큐)와 공개 전환 대기(스냅샷)를 한 표로
  const groups = {};
  for (const i of rq) {
    const k = `${i.channel}|${i.episode}`;
    (groups[k] ??= { channel: i.channel, work: i.work, episode: i.episode, mac: i.mac, up: [], pub: [] });
    groups[k].up.push(i);
  }
  for (const q of needPublic) {
    const k = `${q.channel}|${q.episode}`;
    (groups[k] ??= { channel: q.channel, work: q.work, episode: q.episode, mac: q.mac, up: [], pub: [] });
    groups[k].pub.push(q);
  }
  const brakedSet = new Set(braked.map((b) => b.channel));
  const rows = Object.values(groups).sort((a, b) => (brakedSet.has(b.channel) ? 1 : 0) - (brakedSet.has(a.channel) ? 1 : 0));
  return html`<div class="page">
    <div class="topbar"><h2>오늘, 무엇부터 하면 되나</h2>
      <span class="sub">${new Date().toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" })}</span>
      <${RefreshBtn} onRefresh=${refresh} /></div>
    <div class="kpis">
      <div class=${"kpi" + (rq.length || needPublic.length ? " bad" : " ok")}><div class="lab">검수 대기</div>
        <div class="val">${rq.length}<small> 건</small></div>
        <div class="hint">${needPublic.length ? `+ 공개 전환 대기 ${needPublic.length}건 (아래 대기함 → Studio)` : "공개 전환 대기 없음"}</div></div>
      <div class=${"kpi" + (braked.length ? " bad" : " ok")}><div class="lab">브레이크 발동</div>
        <div class="val">${braked.length}<small> 채널</small></div><div class="hint">대기 가득 → 생성 정지</div></div>
      <div class=${"kpi" + (failed.length ? " warn" : " ok")}><div class="lab">최근 실행 실패</div>
        <div class="val">${failed.length}<small> 건</small></div>
        <div class="hint">${failed.map((f) => f.channel).join(", ") || "없음"}${holdList.length
          ? ` · 중복 보류 ${holdList.length}: ${holdList.join(", ")}` : ""}</div></div>
      <div class=${"kpi" + (beatsOk < machines.length ? " warn" : " ok")}><div class="lab">하트비트</div>
        <div class="val">${beatsOk}<small> / ${machines.length} 대</small></div>
        <div class="hint">${machines.filter((m) => !m.beat).map((m) => m.mac).join(", ") || "전원 수신"}${machines.some((m) => !m.beat) ? " 무보고" : ""}</div></div>
    </div>
    ${snapState === "live"
      ? html`<${MacBoard} machines=${machines} queue=${queue} review=${review} chmap=${chmap} avatars=${avatars} yt=${yt} feed=${feed}
          dateCtl=${dateCtl} failures=${failures} holds=${holds} />`
      : snapState === "loading" ? html`<div class="skel">${selDate} 마감 기록 불러오는 중…</div>`
      : snapState === "none" ? html`<div class="pastnote">${dateCtl}<span>이 날짜의 마감 기록이 없습니다 — 스냅샷은 2026-08-05부터 매일 23:55에 저장됩니다.</span>
          <button class="rfbtn" style=${{ margin: 0 }} onClick=${() => setSelDate(todayStr)}>오늘로 돌아가기</button></div>`
      : html`<div>
          <div class="pastnote">${dateCtl}<b>마감 기록</b><span>매일 23:55 저장 — 당시 신호등·현황 그대로 (검수 대기 ${snap.kpis?.review_wait ?? "?"} · 생성 실패 ${snap.kpis?.failed ?? "?"})</span>
            <button class="rfbtn" style=${{ margin: 0 }} onClick=${() => setSelDate(todayStr)}>오늘로 돌아가기</button></div>
          <${PastBoard} snap=${snap} chmap=${chmap} avatars=${avatars} />
        </div>`}
    <div class="two-col">
      <div class="panel"><h3>검수 대기함 — 채널 × 회차</h3>
        ${braked.length ? html`<p class="note err">⚠ ${braked.length}개 채널이 검수 지연으로 생성 정지 중 — 공개 전환하면 다음 실행부터 다시 생산됩니다</p>` : null}
        ${rows.length === 0 ? html`<div class="skel">대기 중인 항목이 없습니다.</div>` : rows.map((g) => html`
          <div class="queue-row" key=${g.channel + g.episode}>
            <span style=${{ flex: 1 }}><b>${g.channel}</b> EP${g.episode}
              <span style=${{ fontSize: "11px", color: "var(--ink3)" }}> · ${g.work || ""}</span><br/>
              <span style=${{ fontSize: "11.5px", color: "var(--ink2)" }}>
                ${g.up.length ? `검수 대기 ${g.up.length}건` : ""}${g.up.length && g.pub.length ? " · " : ""}${g.pub.length ? `공개 전환 대기 ${g.pub.length}건` : ""}
              </span></span>
            <span class="mac">${g.mac}</span>
            ${brakedSet.has(g.channel) ? html`<span class="brake">생성 정지</span>` : html`<span class="gauge">진행 중</span>`}
            ${g.pub[0]?.video_id ? html`<a class="lnk" target="_blank" rel="noopener"
              href=${"https://youtu.be/" + g.pub[0].video_id}>▶ 영상</a>` : null}
          </div>`)}
      </div>
      <div>
        <div class="panel"><h3>오늘 밤 예정</h3>
          ${machines.map((m) => html`<div class="runline" key=${m.machine_id}>
            <span>${m.schedule_at} ${m.mac} · ${m.label}</span>
            <span class=${"st " + (m.beat ? (m.beat.status === "failed" ? "bad" : "ok") : "bad")}>
              ${m.beat ? `최근 ${ago(m.beat.run_started_at, now)}` : "무보고 ⚠"}</span></div>`)}
        </div>
        <div class="panel"><h3>머신 건강</h3>
          ${machines.filter((m) => m.beat).map((m) => html`<div class="runline" key=${m.machine_id}>
            <span>${m.mac} 디스크</span>
            <span class=${"st " + (Number(m.beat.disk_free_gb) < 60 ? "bad" : "ok")}>${m.beat.disk_free_gb} GB</span></div>`)}
          ${machines.flatMap((m) => (m.beat?.warnings ?? []).map((w, i) => html`
            <div class="runline" key=${m.machine_id + i}><span class="st warn" style=${{ fontWeight: 400, whiteSpace: "normal", fontSize: "11.5px" }}>${w}</span></div>`))}
        </div>
      </div>
    </div>
  </div>`;
}

// ── 영상 피드 ──
function FeedPage({ feed, yt, ytConfigured, refresh, chmap, avatars }) {
  const [filter, setFilter] = useState("전체");
  const [showGone, setShowGone] = useState(false);
  const macs = ["전체", "맥1", "맥2", "맥3", "맥4", "맥5", "맥6"];
  // 피드 = 유튜브에 있는 것. 미업로드(검수 전)는 검수함 전담이라 여기서 뺀다.
  // 반려/삭제(gone·private)는 기본 숨김 — 활성 영상 사이에서 자리만 차지한다는 운영 피드백(8/5).
  const uploaded = feed.filter((x) => x.video_id);
  const isGone = (x) => { const p = yt[x.video_id]?.privacy; return p === "gone" || p === "private"; };
  const goneCount = uploaded.filter(isGone).length;
  const items = uploaded.filter((x) => (filter === "전체" || x.mac === filter) && (showGone || !isGone(x)));

  // 채널별 행 — 담당 채널을 정본에서 뽑아 영상이 없는 채널도 보이게(공백 자체가 신호다)
  const scope = Object.keys(chmap || {}).filter((c) => filter === "전체" || chmap[c].mac === filter);
  const byCh = {};
  for (const x of items) if (x.channel) (byCh[x.channel] ??= []).push(x);
  for (const c of Object.keys(byCh)) {  // 왼쪽=과거 … 오른쪽=최신 (스케치)
    byCh[c].sort((a, b) => String(a.published_at || a.created_at).localeCompare(String(b.published_at || b.created_at)));
  }
  for (const c of Object.keys(byCh)) if (!scope.includes(c)) scope.push(c);  // 정본 밖 채널도 누락 없이
  const rows = scope.sort((a, b) => String(chmap?.[a]?.mac ?? "").localeCompare(String(chmap?.[b]?.mac ?? "")) || a.localeCompare(b));
  // 레일은 최신 끝에서 시작 — 처음 보이는 게 최신이어야 한다
  const railInit = (el) => { if (el && !el.dataset.init) { el.dataset.init = "1"; el.scrollLeft = el.scrollWidth; } };

  return html`<div class="page">
    <div class="topbar"><h2>영상 피드</h2><span class="sub">${filter === "전체" ? "전체 최신순" : "채널별 · 오른쪽이 최신"} · 활성 ${uploaded.length - goneCount}건</span>
      <${RefreshBtn} onRefresh=${refresh} /></div>
    ${!ytConfigured ? html`<p class="note">공개/일부공개 배지는 YOUTUBE_API_KEY 시크릿을 설정하면 켜집니다.</p>` : null}
    <div class="filters">${macs.map((m) => html`
      <span key=${m} class=${"chip" + (m === filter ? " on" : "")} onClick=${() => setFilter(m)}>${m}</span>`)}
      <span style=${{ width: "12px" }}></span>
      ${goneCount ? html`<span class=${"chip" + (showGone ? " on" : "")}
        onClick=${() => setShowGone(!showGone)}>반려·삭제 ${goneCount}건 ${showGone ? "숨기기" : "보기"}</span>` : null}
    </div>
    ${filter === "전체" ? (items.length === 0 ? html`<div class="skel">표시할 클립이 없습니다.</div>`
      : html`<div class="grid">${[...items].sort((a, b) =>
          String(b.published_at || b.created_at).localeCompare(String(a.published_at || a.created_at)))
        .map((x) => html`
        <div class="fcard" key=${x.clip_id}>
          <a class=${"thumb" + (yt[x.video_id]?.privacy === "gone" ? " nothumb" : "")}
             href=${"https://youtu.be/" + x.video_id} target="_blank" rel="noopener">
            ${yt[x.video_id]?.privacy !== "gone" ? html`<img loading="lazy" src=${"https://i.ytimg.com/vi/" + x.video_id + "/mqdefault.jpg"} alt="" />` : null}
            <${StatusPill} st=${yt[x.video_id]} />
          </a>
          <div class="fbody">
            <p class="ft">${x.title || "(제목 미기록)"}</p>
            <div class="fchan">
              <${ChannelChip} name=${x.channel || "?"} chmap=${chmap} avatars=${avatars} />
              <span class="when">${fmtDT(x.published_at || x.created_at)}</span>
            </div>
          </div>
        </div>`)}</div>`)
      : rows.length === 0 ? html`<div class="skel">표시할 채널이 없습니다.</div>` : rows.map((ch) => {
      const vids = byCh[ch] ?? [];
      return html`<div class="chstrip" key=${ch}>
        <div class="chside">
          <${ChannelChip} name=${ch} chmap=${chmap} avatars=${avatars} />
          <span class="sub">${chmap?.[ch]?.mac ?? "?"} · ${vids.length}편</span>
        </div>
        ${vids.length === 0 ? html`<div class="railempty">이 기간에 올라간 영상이 없습니다.</div>`
          : html`<div class="chrail" ref=${railInit}>${vids.map((x) => html`
          <a class="vtile" key=${x.clip_id} href=${"https://youtu.be/" + x.video_id} target="_blank" rel="noopener">
            <span class=${"thumb" + (yt[x.video_id]?.privacy === "gone" ? " nothumb" : "")}>
              ${yt[x.video_id]?.privacy !== "gone" ? html`<img loading="lazy" src=${"https://i.ytimg.com/vi/" + x.video_id + "/mqdefault.jpg"} alt="" />` : null}
              <${StatusPill} st=${yt[x.video_id]} />
            </span>
            <p class="vt">${x.title || "(제목 미기록)"}</p>
            <p class="vd">${fmtDT(x.published_at || x.created_at)}${x.episode_no != null ? " · " + x.episode_no + "회차" : ""}</p>
          </a>`)}</div>`}

function spark(daily) {
  if (!daily || daily.length < 2) return null;
  const vs = daily.map((d) => d[1]), max = Math.max(...vs, 1), w = 86, h = 20;
  const pts = vs.map((v, i) => `${((i / (vs.length - 1)) * w).toFixed(1)},${(h - 2 - (v / max) * (h - 4)).toFixed(1)}`).join(" ");
  return html`<svg width=${w} height=${h} style=${{ verticalAlign: "middle" }}>
    <polyline points=${pts} fill="none" stroke="var(--accent)" strokeWidth="1.5" /></svg>`;
}

function ReviewCard({ item, onDecide, chmap, avatars }) {
  const [url, setUrl] = useState(null);
  const [note, setNote] = useState("");
  const [prodReject, setProdReject] = useState(false);
  // judge 와 사람 판단이 갈리는 지점 — 그 이유가 judge 개선의 유일한 재료다(스펙 §5 비교 뷰)
  const lowJudge = item.judge?.quality_score != null && Number(item.judge.quality_score) < 0.5;
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    let alive = true;
    api("/api/clip-url?clip_id=" + item.clip_id)
      .then((d) => alive && setUrl(d.url || null)).catch(() => alive && setUrl(null));
    return () => { alive = false; };
  }, [item.clip_id]);
  const decide = async (decision) => {
    setBusy(true);
    try { await onDecide(item, decision, note, prodReject ? "production" : "scene"); }
    finally { setBusy(false); }
  };
  return html`<div class="rcard">
    <div class="player">${url ? html`<video controls preload="metadata" src=${url}></video>`

        <span class="k">작품</span> ${item.work || "?"}${item.episode != null ? " · " + item.episode + "회차" : ""}<br/>
        <span class="k">구간</span> ${Number(item.start).toFixed(1)} → ${Number(item.end).toFixed(1)}초
          (${Number(item.duration).toFixed(1)}초)<br/>

      </div>
      ${item.judge?.rubric_scores?.hallucination_flag ? html`
        <div class="hallu">⚠ 환각 의심 — 합격해도 발행 게이트에서 자동 차단됩니다</div>` : null}
      ${item.judge ? html`<div class="judgebox">

      </div>` : html`<div class="judgebox" style=${{ color: "var(--ink3)" }}>judge 대기중 — 결정은 그대로 가능합니다</div>`}
      <input class="reason" placeholder="사유·메모 (선택) — 합격·반려 모두 기록됩니다"
        value=${note} onChange=${(e) => setNote(e.target.value)} />
      ${lowJudge && !note.trim() ? html`<p class="notehint">💬 judge 가 낮게 봤습니다(${Number(item.judge.quality_score).toFixed(2)})

// ── 커밋 · 배포 ──
function DeployPage({ machines, commits, refresh }) {
  // 기준 SHA: GitHub 최신(head) — 토큰 없으면 머신들 SHA 상호 비교(최다수)
  const heads = {};
  for (const key of ["brain", "aivideo"]) {
    const list = commits?.repos?.[key]?.commits;
    if (list?.length) { heads[key] = { sha: list[0].sha, shas: list.map((c) => c.sha) }; continue; }
    const counts = {};
    for (const m of machines) { const s = key === "brain" ? m.beat?.brain_sha : m.beat?.aivideo_sha; if (s) counts[s] = (counts[s] || 0) + 1; }
    const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    heads[key] = best ? { sha: best[0], shas: null } : null;
  }
  const compare = (sha, key) => {
    const h = heads[key];
    if (!sha || !h) return ["?", "old"];
    if (sha === h.sha) return ["✓ 최신", "ok"];
    if (h.shas) { const idx = h.shas.indexOf(sha); if (idx > 0) return [`✗ ${idx} 뒤`, "old"]; return ["✗ 15+ 뒤", "old"]; }
    return ["✗ 불일치", "old"];
  };
  return html`<div class="page">
    <div class="topbar"><h2>커밋 · 배포</h2><span class="sub">레포 최신 커밋 + 6대 pull 매트릭스</span>
      <${RefreshBtn} onRefresh=${refresh} /></div>
    ${commits?.configured === false ? html`<p class="note">GITHUB_TOKEN 시크릿이 없어 커밋 목록은 비활성 — pull 매트릭스는 머신 간 상호 비교(다수결 SHA)로 동작 중입니다.</p>` : null}
    ${commits?.configured ? html`<div class="two-col">
      ${["brain", "aivideo"].map((key) => { const r = commits.repos[key]; return html`
        <div class="panel" key=${key}><h3>${r?.repo || key}</h3>
          ${r?.error ? html`<p class="note err">${r.error}</p>` : (r?.commits ?? []).slice(0, 6).map((c) => html`
            <div class="commit" key=${c.sha}><span class="sha">${shortSha(c.sha)}</span>
              <span class="msg">${c.message}</span>
              <span class="when">${(c.date || "").slice(5, 10)}</span></div>`)}
        </div>`; })}
    </div>` : null}
    <div class="panel"><h3>Pull 매트릭스</h3>
      <div class="tblw"><table><thead><tr><th>머신</th><th>brain</th><th></th><th>ai-video</th><th></th><th>보고</th></tr></thead>
        <tbody>${machines.map((m) => {
          const [bTxt, bCls] = compare(m.beat?.brain_sha, "brain");
          const [aTxt, aCls] = compare(m.beat?.aivideo_sha, "aivideo");
          return html`<tr key=${m.machine_id}>
            <td class="mac">${m.mac} <span style=${{ color: "var(--ink3)" }}>${m.machine_id}</span></td>
            <td class="sha">${shortSha(m.beat?.brain_sha)}</td><td class=${"sync " + (m.beat ? bCls : "old")}>${m.beat ? bTxt : "무보고"}</td>
            <td class="sha">${shortSha(m.beat?.aivideo_sha)}</td><td class=${"sync " + (m.beat ? aCls : "old")}>${m.beat ? aTxt : "무보고"}</td>
            <td>${m.beat ? new Date(m.beat.run_started_at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—"}</td>
          </tr>`; })}</tbody></table></div>
      <p class="note" style=${{ marginTop: "10px", marginBottom: 0 }}>SHA 는 각 머신이 <b>마지막 실행 시점</b>에 보고한 값 — 실행 사이에 pull 했다면 다음 실행에서 갱신됩니다.</p>
    </div>
  </div>`;
}

// ── 앱 ──
const PAGES = [
  ["home", "⌂ 홈"], ["review", "☑ 검수함"], ["feed", "▶ 영상 피드"], ["perf", "↗ 채널 성과"],
  ["machines", "▦ 머신 로그"], ["deploy", "⇅ 커밋 · 배포"],
];

function App() {
  const [authed, setAuthed] = useState(null); // null=확인중 false=로그인 true=OK
  const [page, setPage] = useState("home");
  const [feed, setFeed] = useState([]);
  const [mx, setMx] = useState(null);        // {machines, queue, anomalies, now}
  const [commits, setCommits] = useState(null);
  const [review, setReview] = useState(null);
  const [yt, setYt] = useState({});          // video_id -> {privacy}
  const [avatars, setAvatars] = useState({}); // channel_id -> 아바타 URL (7일 캐시)
  const [ytConfigured, setYtConfigured] = useState(true);
  const [updated, setUpdated] = useState(null);

  const load = useCallback(async () => {
    const [f, m] = await Promise.all([api("/api/feed?days=60"), api("/api/machines")]);
    setFeed(f.items || []); setMx(m); setUpdated(new Date());
    api("/api/commits").then(setCommits).catch(() => null);
    api("/api/review").then(setReview).catch(() => null);
    // 공개상태: 피드 + 검수큐의 video_id 합집합을 50개씩
    const ids = [...new Set([...(f.items || []).map((x) => x.video_id), ...(m.queue || []).map((q) => q.video_id)].filter(Boolean))];
    for (let i = 0; i < ids.length; i += 50) {
      try {
        const d = await api("/api/ytstatus?ids=" + ids.slice(i, i + 50).join(","));
        if (d.configured === false) { setYtConfigured(false); break; }
        setYt((prev) => ({ ...prev, ...d.statuses }));
      } catch { break; }
    }
  }, []);

  useEffect(() => {
    if (!KEY()) { setAuthed(false); return; }
    api("/api/feed?days=1").then(() => setAuthed(true)).catch((e) => setAuthed(e.message === "unauthorized" || e.message === "setup" ? false : true));
  }, []);
  useEffect(() => {
    if (authed !== true) return;
    load();
    const t = setInterval(load, 5 * 60 * 1000);
    return () => clearInterval(t);
  }, [authed, load]);
  useEffect(() => {                            // 채널 아바타 — 잘 안 바뀌므로 7일 localStorage 캐시
    if (authed !== true) return;
    try {
      const c = JSON.parse(localStorage.getItem("ves_avatars") || "null");
      // 빈 캐시는 무시 — API 미배포/일시 오류 응답이 7일 캐시로 박제되는 것 방지
      if (c && Date.now() - c.t < 7 * 864e5 && Object.keys(c.a || {}).length) { setAvatars(c.a); return; }
    } catch { /* 캐시 깨짐 → 새로 */ }
    api("/api/chavatars").then((d) => {
      const a = d.avatars || {};
      setAvatars(a);
      if (Object.keys(a).length) localStorage.setItem("ves_avatars", JSON.stringify({ t: Date.now(), a }));
    }).catch(() => null);
  }, [authed]);

  if (authed === null) return html`<div class="skel" style=${{ padding: "40px" }}>확인 중…</div>`;
  if (authed === false) return html`<${Login} onOk=${() => setAuthed(true)} />`;

  const machines = mx?.machines ?? [];
  const queue = mx?.queue ?? [];
  const reviewCount = queue.filter((q) => !q.stale && !q.unknown && (!q.video_id || (yt[q.video_id] && !["public", "gone"].includes(yt[q.video_id].privacy)))).length;

  return html`<div class="shell">
    <aside>
      <div class="brand"><h1>VES OPS</h1><div class="v">맥미니 6대 · 19채널 · React v2</div></div>
      <nav>${PAGES.map(([id, label]) => html`
        <a key=${id} class=${page === id ? "on" : ""} onClick=${() => setPage(id)}>${label}
          ${id === "review" && (review?.queue?.length ?? 0) ? html`<span class="cnt hot">${review.queue.length}</span>` : null}
          ${id === "feed" && feed.length ? html`<span class="cnt">${feed.length}</span>` : null}
        </a>`)}</nav>
      <div class="side-foot">
        <b style=${{ color: "var(--side-on)" }}>하트비트</b><br/>
        ${machines.map((m) => html`<span key=${m.machine_id} class=${m.beat ? "hb-ok" : "hb-bad"}>
          ● ${m.mac} ${m.beat ? ago(m.beat.run_started_at, mx?.now) : "무보고"}</span> `)}
        <br/><span class="hb-mut">갱신 ${updated ? updated.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) : "…"} · 5분마다 자동</span>
      </div>
    </aside>
    <main>
      ${page === "home" ? html`<${HomePage} machines=${machines} queue=${queue} yt=${yt} now=${mx?.now}
        review=${review} chmap=${mx?.channels ?? {}} avatars=${avatars} feed=${feed} refresh=${load}
        failures=${mx?.failuresToday ?? {}} holds=${mx?.holdsToday ?? {}} />` : null}
      ${page === "review" ? html`<${ReviewPage} review=${review} chmap=${mx?.channels ?? {}} avatars=${avatars}
        reload=${() => api("/api/review").then(setReview).catch(() => null)} />` : null}
      ${page === "feed" ? html`<${FeedPage} feed=${feed} yt=${yt} ytConfigured=${ytConfigured} refresh=${load}
        chmap=${mx?.channels ?? {}} avatars=${avatars} />` : null}
      ${page === "perf" ? html`<${PerfPage} />` : null}
      ${page === "machines" ? html`<${MachinesPage} machines=${machines} now=${mx?.now} anomalies=${mx?.anomalies ?? []} refresh=${load} />` : null}
      ${page === "deploy" ? html`<${DeployPage} machines=${machines} commits=${commits} refresh=${load} />` : null}
    </main>
  </div>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script></body></html>
