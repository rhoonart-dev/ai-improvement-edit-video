<html lang="ko"><head><meta charset="utf-8">

<title>VES OPS — 운영 대시보드</title>
<!-- React 18 단일 파일 구성: 빌드 없이 esm.sh CDN 에서 ESM 으로 로드.
     이유: 배포가 'GitHub Pages 에 파일 하나 드래그'로 유지된다. 번들러 도입 시점에 그대로 이식 가능. -->
<style>
:root{--ground:#eef1f4;--panel:#fff;--side:#1e2833;--side-ink:#aebbc7;--side-on:#fff;
--ink:#232830;--ink2:#5c6570;--ink3:#8b939d;--line:#c9d0d8;--soft:#dde2e8;
--accent:#20586e;--accent-soft:#e3edf2;--ok:#1d7a46;--okbg:#e2f1e8;--warn:#a06008;--warnbg:#f7ecd8;
--bad:#a33131;--badbg:#f6e4e4;--mono:ui-monospace,"SF Mono",Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--ground:#15181c;--panel:#1f242a;--side:#11161b;--side-ink:#7e8a95;
--side-on:#e8edf2;--ink:#e3e7ec;--ink2:#9aa3ad;--ink3:#6d757f;--line:#3c434c;--soft:#2e343b;
--accent:#7db3c9;--accent-soft:#243440;--ok:#5cb884;--okbg:#22352b;--warn:#d9a458;--warnbg:#3a3222;
--bad:#d97e7e;--badbg:#3c2727}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif}
.shell{display:flex;min-height:100vh}
aside{width:216px;flex-shrink:0;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand h1{font-size:16px;margin:0;color:var(--side-on)}.brand .v{font-family:var(--mono);font-size:10px;opacity:.65}
aside nav{display:flex;flex-direction:column;padding:10px 0}
aside nav a{display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;font-size:13.5px;color:var(--side-ink);text-decoration:none;border-left:3px solid transparent}
aside nav a:hover{color:var(--side-on);background:rgba(255,255,255,.04)}
aside nav a.on{color:var(--side-on);background:rgba(255,255,255,.07);border-left-color:#e8b04b;font-weight:600}
.cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:rgba(255,255,255,.1);padding:1px 7px;border-radius:10px}
.cnt.hot{background:var(--bad);color:#fff}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;line-height:1.8}
.hb-ok{color:#7ec89a}.hb-bad{color:#e08a8a}.hb-mut{opacity:.55}
main{flex:1;min-width:0;padding:0 26px 60px}
.page{max-width:1280px;margin:0 auto}
.topbar{display:flex;align-items:baseline;gap:14px;padding:22px 0 14px;flex-wrap:wrap}
.topbar h2{font-size:19px;margin:0}.topbar .sub{color:var(--ink2);font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12px;border:1px solid var(--line);padding:3px 11px;border-radius:20px;color:var(--ink2);background:var(--panel);cursor:pointer;user-select:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--soft)}
.thumb{aspect-ratio:16/9;background:#0003;display:block;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}

.thumb.nothumb::after{content:"썸네일 없음 · 비공개/삭제";font-size:10.5px;color:var(--ink3);text-align:center;padding:0 10px}

.pill.pub{background:var(--okbg);color:var(--ok)}.pill.unl{background:var(--warnbg);color:var(--warn)}
.pill.gone{background:var(--badbg);color:var(--bad)}.pill.na{background:var(--soft);color:var(--ink3)}
.thumb .pill{position:absolute;top:8px;left:8px}
.card .body{padding:10px 12px 12px}
.card .title{font-size:12.5px;font-weight:600;line-height:1.4;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.card .meta{font-size:11px;color:var(--ink2);margin:0 0 8px}
.mac{font-family:var(--mono);font-size:10.5px;color:var(--accent)}
.lnk{font-size:11px;border:1px solid var(--line);padding:2px 8px;color:var(--ink2);text-decoration:none;margin-right:6px}
.panel{background:var(--panel);border:1px solid var(--soft);padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:14.5px}
.tblw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}

td.num,th.num{text-align:right}
tr.rowlink{cursor:pointer}tr.rowlink:hover td{background:var(--accent-soft)}
.bar{display:inline-block;height:8px;background:var(--accent);opacity:.75;vertical-align:middle}

.kpi .val small{font-size:13px;font-weight:400;color:var(--ink2)}

.kpi.warn{border-left:4px solid var(--warn)}.kpi.warn .val{color:var(--warn)}

.two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}

.queue-row:last-child{border-bottom:none}

.gauge{font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap}
.mac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.mac-card{background:var(--panel);border:1px solid var(--soft);padding:14px 16px}
.mac-card h4{margin:0 0 2px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mac-card .role{font-size:11.5px;color:var(--ink3);margin:0 0 10px}
.runline{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-top:1px dashed var(--soft);gap:10px}
.st{font-weight:600;white-space:nowrap}
.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}.st.skip{color:var(--ink3)}.st.warn{color:var(--warn)}
.logtail{font-family:var(--mono);font-size:10px;color:var(--ink2);background:var(--ground);border:1px dashed var(--line);padding:8px 10px;margin-top:10px;overflow-x:auto;white-space:pre-wrap;max-height:200px;overflow-y:auto}
.sha{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.sync{font-weight:700}.sync.ok{color:var(--ok)}.sync.old{color:var(--bad)}
.commit{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--soft);align-items:baseline}
.commit .when{margin-left:auto;color:var(--ink3);font-size:11.5px;flex-shrink:0;white-space:nowrap}
.commit .msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#login-wrap{position:fixed;inset:0;background:var(--ground);display:flex;align-items:center;justify-content:center;z-index:9}
#login-wrap .box{background:var(--panel);border:1px solid var(--soft);padding:28px;width:320px}
#login-wrap h1{font-size:17px;margin:0 0 4px}#login-wrap p{font-size:12.5px;color:var(--ink2);margin:0 0 14px}
#login-wrap input{width:100%;padding:9px 11px;font:inherit;border:1px solid var(--line);background:var(--ground);color:var(--ink);margin-bottom:10px}
#login-wrap button{width:100%;padding:9px;font:inherit;font-weight:600;background:var(--accent);color:#fff;border:none;cursor:pointer}
#login-wrap .msg{font-size:12px;color:var(--bad);min-height:16px;margin-top:8px}
.skel{color:var(--ink3);font-size:13px;padding:20px 0}
details.tail summary{cursor:pointer;font-size:11.5px;color:var(--ink2)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.rcard{background:var(--panel);border:1px solid var(--soft);display:flex;flex-direction:column}
.player{aspect-ratio:9/16;max-height:340px;background:#000;display:flex;align-items:center;justify-content:center}
.player video{width:100%;height:100%;object-fit:contain}
.player .skel{color:#888}
.rbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.rtitle{font-size:13px;font-weight:600;line-height:1.4;margin:0}
.rmeta{font-size:11.5px;color:var(--ink2);line-height:1.7;font-variant-numeric:tabular-nums}
.rmeta .k{color:var(--ink3)}
.acts{display:flex;gap:8px;margin-top:auto}
.btn{flex:1;padding:8px;font:inherit;font-size:13px;font-weight:600;border:1px solid;cursor:pointer;background:var(--panel)}
.btn.pass{border-color:var(--ok);color:var(--ok)}.btn.pass:hover{background:var(--okbg)}
.btn.rej{border-color:var(--bad);color:var(--bad)}.btn.rej:hover{background:var(--badbg)}
.btn:disabled{opacity:.5;cursor:wait}
.reason{width:100%;padding:6px 9px;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--ground);color:var(--ink)}
.decided-row{display:flex;gap:10px;align-items:center;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--soft)}
.decided-row:last-child{border-bottom:none}
.dpill{font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px}
.dpill.approved{background:var(--okbg);color:var(--ok)}.dpill.rejected{background:var(--badbg);color:var(--bad)}
.namebox{padding:5px 9px;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:130px}
@media(max-width:760px){.shell{flex-direction:column}aside{width:100%;height:auto;position:static}
aside nav{flex-direction:row;overflow-x:auto;padding:0}aside nav a{border-left:none;border-bottom:3px solid transparent}
aside nav a.on{border-left-color:transparent;border-bottom-color:#e8b04b}.side-foot{display:none}main{padding:0 14px 40px}}
</style></head><body>
<div id="root"><div class="skel" style="padding:40px">불러오는 중…</div></div>
<script type="module">
import React, { useState, useEffect, useMemo, useCallback } from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
import htm from "https://esm.sh/htm@3.1.1";
const html = htm.bind(React.createElement);

const BASE = "https://fdidiqdhcyctdbogxkdu.supabase.co/functions/v1/dashboard";
const KEY = () => localStorage.getItem("ves_key") || "";
const fmt = (n) => n == null ? "—" : Number(n).toLocaleString("ko-KR");
const pct = (n) => n == null ? "—" : Number(n).toFixed(1);
const shortSha = (s) => (s || "").slice(0, 7) || "—";
const ago = (iso, now) => {
  if (!iso) return "무보고";
  const h = (new Date(now || Date.now()) - new Date(iso)) / 36e5;
  if (h < 1) return `${Math.round(h * 60)}분 전`;
  if (h < 48) return `${Math.round(h)}시간 전`;
  return `${Math.round(h / 24)}일 전`;
};
const PILL = { public: ["pub", "공개"], unlisted: ["unl", "일부공개"], private: ["gone", "비공개"], gone: ["gone", "반려/삭제"] };
const RESULT = {
  generated: ["✓ 생성", "ok"], paused_pending: ["⏸ 대기 가득 — 검수 필요", "warn"],
  waiting_source: ["… 소스 대기", "skip"], failed: ["✗ 실패", "bad"], skipped: ["– 건너뜀", "skip"],
};
const ERR_LABEL = { llm_json: "AI응답 파싱", api_quota: "API 쿼터", env_config: "환경설정", source_missing: "소스 없음", video_id_mismatch: "소스 불일치", code_bug: "코드 버그", unknown: "미분류" };

async function api(path) {
  const r = await fetch(BASE + path, { headers: { "x-ves-key": encodeURIComponent(KEY()) } });
  if (r.status === 401) throw new Error("unauthorized");
  if (r.status === 503) { const b = await r.json(); if (b.setup) throw new Error("setup"); }
  return r.json();
}

function Login({ onOk, initialMsg }) {
  const [pw, setPw] = useState(""); const [msg, setMsg] = useState(initialMsg || "");
  const go = async () => {
    localStorage.setItem("ves_key", pw.trim());
    try { await api("/api/feed?days=1"); onOk(); }
    catch (e) {
      setMsg(e.message === "unauthorized" ? "코드가 틀렸거나 만료됐습니다."
        : e.message === "setup" ? "서버에 DASHBOARD_PASSWORD 시크릿이 설정되지 않았습니다."
        : "접속 실패: " + e.message);
    }
  };
  return html`<div id="login-wrap"><div class="box">
    <h1>VES OPS</h1><p>팀 접속 코드를 입력하세요.</p>
    <input type="password" placeholder="접속 코드" autoComplete="current-password"
      value=${pw} onChange=${(e) => setPw(e.target.value)} onKeyDown=${(e) => e.key === "Enter" && go()} />
    <button onClick=${go}>들어가기</button><div class="msg">${msg}</div>
  </div></div>`;
}

function StatusPill({ st }) {
  const [cls, label] = (st && PILL[st.privacy]) || ["na", "상태 미확인"];
  return html`<span class=${"pill " + cls}>${label}</span>`;
}

// ── 홈 · 검수함 ──
function HomePage({ machines, queue, yt, now }) {
  // 검수 대상: stale 아님 + (미업로드 || 업로드됐는데 아직 public 아님)
  const items = queue.filter((q) => !q.stale && !q.unknown).map((q) => {
    const st = q.video_id ? yt[q.video_id]?.privacy : null;
    return { ...q, yt: st };
  });
  const needUpload = items.filter((q) => !q.video_id);
  const needPublic = items.filter((q) => q.video_id && q.yt && q.yt !== "public" && q.yt !== "gone");
  const braked = machines.flatMap((m) => (m.beat?.channels ?? []).filter((c) => c.result === "paused_pending").map((c) => ({ ...c, mac: m.mac })));
  const failed = machines.flatMap((m) => (m.beat?.channels ?? []).filter((c) => c.result === "failed").map((c) => ({ ...c, mac: m.mac })));
  const beatsOk = machines.filter((m) => m.beat).length;
  // 채널×회차로 묶기
  const groups = {};
  for (const q of [...needPublic, ...needUpload]) {
    const k = `${q.channel}|${q.episode}`;
    (groups[k] ??= { channel: q.channel, work: q.work, episode: q.episode, mac: q.mac, up: [], pub: [] });
    (q.video_id ? groups[k].pub : groups[k].up).push(q);
  }
  const brakedSet = new Set(braked.map((b) => b.channel));
  const rows = Object.values(groups).sort((a, b) => (brakedSet.has(b.channel) ? 1 : 0) - (brakedSet.has(a.channel) ? 1 : 0));
  return html`<div class="page">
    <div class="topbar"><h2>오늘, 무엇부터 하면 되나</h2>
      <span class="sub">${new Date().toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" })}</span></div>
    <div class="kpis">
      <div class=${"kpi" + (needUpload.length + needPublic.length ? " bad" : " ok")}><div class="lab">검수 대기</div>
        <div class="val">${needUpload.length + needPublic.length}<small> 건</small></div>
        <div class="hint">업로드 대기 ${needUpload.length} · 공개 대기 ${needPublic.length}</div></div>
      <div class=${"kpi" + (braked.length ? " bad" : " ok")}><div class="lab">브레이크 발동</div>
        <div class="val">${braked.length}<small> 채널</small></div><div class="hint">대기 가득 → 생성 정지</div></div>
      <div class=${"kpi" + (failed.length ? " warn" : " ok")}><div class="lab">최근 실행 실패</div>
        <div class="val">${failed.length}<small> 건</small></div>
        <div class="hint">${failed.map((f) => f.channel).join(", ") || "없음"}</div></div>
      <div class=${"kpi" + (beatsOk < machines.length ? " warn" : " ok")}><div class="lab">하트비트</div>
        <div class="val">${beatsOk}<small> / ${machines.length} 대</small></div>
        <div class="hint">${machines.filter((m) => !m.beat).map((m) => m.mac).join(", ") || "전원 수신"}${machines.some((m) => !m.beat) ? " 무보고" : ""}</div></div>
    </div>
    <div class="two-col">
      <div class="panel"><h3>검수 대기함 — 채널 × 회차</h3>
        ${braked.length ? html`<p class="note err">⚠ ${braked.length}개 채널이 검수 지연으로 생성 정지 중 — 공개 전환하면 다음 실행부터 다시 생산됩니다</p>` : null}
        ${rows.length === 0 ? html`<div class="skel">대기 중인 항목이 없습니다.</div>` : rows.map((g) => html`
          <div class="queue-row" key=${g.channel + g.episode}>
            <span style=${{ flex: 1 }}><b>${g.channel}</b> EP${g.episode}
              <span style=${{ fontSize: "11px", color: "var(--ink3)" }}> · ${g.work || ""}</span><br/>
              <span style=${{ fontSize: "11.5px", color: "var(--ink2)" }}>
                ${g.up.length ? `업로드 대기 ${g.up.length}건` : ""}${g.up.length && g.pub.length ? " · " : ""}${g.pub.length ? `공개 대기 ${g.pub.length}건` : ""}
              </span></span>
            <span class="mac">${g.mac}</span>
            ${brakedSet.has(g.channel) ? html`<span class="brake">생성 정지</span>` : html`<span class="gauge">진행 중</span>`}
            ${g.pub[0]?.video_id ? html`<a class="lnk" target="_blank" rel="noopener"
              href=${"https://studio.youtube.com/video/" + g.pub[0].video_id + "/edit"}>Studio →</a>` : null}
          </div>`)}
      </div>
      <div>
        <div class="panel"><h3>오늘 밤 예정</h3>
          ${machines.map((m) => html`<div class="runline" key=${m.machine_id}>
            <span>${m.schedule_at} ${m.mac} · ${m.label}</span>
            <span class=${"st " + (m.beat ? (m.beat.status === "failed" ? "bad" : "ok") : "bad")}>
              ${m.beat ? `최근 ${ago(m.beat.run_started_at, now)}` : "무보고 ⚠"}</span></div>`)}
        </div>
        <div class="panel"><h3>머신 건강</h3>
          ${machines.filter((m) => m.beat).map((m) => html`<div class="runline" key=${m.machine_id}>
            <span>${m.mac} 디스크</span>
            <span class=${"st " + (Number(m.beat.disk_free_gb) < 60 ? "bad" : "ok")}>${m.beat.disk_free_gb} GB</span></div>`)}
          ${machines.flatMap((m) => (m.beat?.warnings ?? []).map((w, i) => html`
            <div class="runline" key=${m.machine_id + i}><span class="st warn" style=${{ fontWeight: 400, whiteSpace: "normal", fontSize: "11.5px" }}>${w}</span></div>`))}
        </div>
      </div>
    </div>
  </div>`;
}

// ── 영상 피드 ──
function FeedPage({ feed, yt, ytConfigured }) {
  const [filter, setFilter] = useState("전체");
  const [showGone, setShowGone] = useState(false);
  const macs = ["전체", "맥1", "맥2", "맥3", "맥4", "맥5", "맥6"];
  // 피드 = 유튜브에 있는 것. 미업로드(검수 전)는 검수함 전담이라 여기서 뺀다.
  // 반려/삭제(gone·private)는 기본 숨김 — 활성 영상 사이에서 자리만 차지한다는 운영 피드백(8/5).
  const uploaded = feed.filter((x) => x.video_id);
  const isGone = (x) => { const p = yt[x.video_id]?.privacy; return p === "gone" || p === "private"; };
  const goneCount = uploaded.filter(isGone).length;
  const items = uploaded.filter((x) => (filter === "전체" || x.mac === filter) && (showGone || !isGone(x)));
  return html`<div class="page">
    <div class="topbar"><h2>영상 피드</h2><span class="sub">유튜브에 올라간 클립 — 최신순 · 활성 ${uploaded.length - goneCount}건</span></div>
    ${!ytConfigured ? html`<p class="note">공개/일부공개 배지는 YOUTUBE_API_KEY 시크릿을 설정하면 켜집니다.</p>` : null}
    <div class="filters">${macs.map((m) => html`
      <span key=${m} class=${"chip" + (m === filter ? " on" : "")} onClick=${() => setFilter(m)}>${m}</span>`)}
      <span style=${{ width: "12px" }}></span>
      ${goneCount ? html`<span class=${"chip" + (showGone ? " on" : "")}
        onClick=${() => setShowGone(!showGone)}>반려·삭제 ${goneCount}건 ${showGone ? "숨기기" : "보기"}</span>` : null}
    </div>
    ${items.length === 0 ? html`<div class="skel">표시할 클립이 없습니다.</div>` : html`
    <div class="grid">${items.map((x) => html`
      <div class="card" key=${x.clip_id}>
        <a class=${"thumb" + (x.video_id && yt[x.video_id]?.privacy === "gone" ? " nothumb" : "")}
           href=${x.video_id ? "https://www.youtube.com/shorts/" + x.video_id : undefined} target="_blank" rel="noopener">
          ${x.video_id && yt[x.video_id]?.privacy !== "gone" ? html`<img loading="lazy" src=${"https://i.ytimg.com/vi/" + x.video_id + "/mqdefault.jpg"} alt="" />` : null}
          <${StatusPill} st=${x.video_id ? yt[x.video_id] : null} />
        </a>
        <div class="body">
          <p class="title">${x.title || "(제목 미기록)"}</p>
          <p class="meta">${x.channel || "?"} · <span class="mac">${x.mac || "?"}</span> · ${(x.created_at || "").slice(5, 16).replace("T", " ")}</p>
          <a class="lnk" href=${"https://www.youtube.com/shorts/" + x.video_id} target="_blank" rel="noopener">▶ 보기</a>
          <a class="lnk" href=${"https://studio.youtube.com/video/" + x.video_id + "/edit"} target="_blank" rel="noopener">Studio</a>
        </div>
      </div>`)}</div>`}
  </div>`;
}

// ── 채널 성과 ──
function spark(daily) {
  if (!daily || daily.length < 2) return null;
  const vs = daily.map((d) => d[1]), max = Math.max(...vs, 1), w = 86, h = 20;
  const pts = vs.map((v, i) => `${((i / (vs.length - 1)) * w).toFixed(1)},${(h - 2 - (v / max) * (h - 4)).toFixed(1)}`).join(" ");
  return html`<svg width=${w} height=${h} style=${{ verticalAlign: "middle" }}>
    <polyline points=${pts} fill="none" stroke="var(--accent)" strokeWidth="1.5" /></svg>`;
}

// ── 검수함 (스펙 1급 데이터: review_decisions) ──
function ReviewCard({ item, onDecide }) {
  const [url, setUrl] = useState(null);
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    let alive = true;
    api("/api/clip-url?clip_id=" + item.clip_id)
      .then((d) => alive && setUrl(d.url || null)).catch(() => alive && setUrl(null));
    return () => { alive = false; };
  }, [item.clip_id]);
  const decide = async (decision) => {
    setBusy(true);
    try { await onDecide(item, decision, note); } finally { setBusy(false); }
  };
  return html`<div class="rcard">
    <div class="player">${url ? html`<video controls preload="metadata" src=${url}></video>`
      : html`<span class="skel">영상 URL 발급 중…</span>`}</div>
    <div class="rbody">
      <p class="rtitle">${item.title || "(제목 미기록)"}</p>
      <div class="rmeta">
        <span class="k">채널</span> ${item.channel || "?"} · <span class="mac">${item.mac || "?"}</span><br/>
        <span class="k">작품</span> ${item.work || "?"}<br/>
        <span class="k">구간</span> ${Number(item.start).toFixed(1)} → ${Number(item.end).toFixed(1)}초
          (${Number(item.duration).toFixed(1)}초)<br/>
        <span class="k">judge</span> ${item.judge_quality != null ? "품질 " + Number(item.judge_quality).toFixed(2) : "미실행"}
          · <span class="k">생성</span> ${(item.created_at || "").slice(5, 16).replace("T", " ")}
      </div>
      <input class="reason" placeholder="반려 사유 (선택) — 쌓이면 개선 신호가 됩니다"
        value=${note} onChange=${(e) => setNote(e.target.value)} />
      <div class="acts">
        <button class="btn pass" disabled=${busy} onClick=${() => decide("approved")}>✅ 합격</button>
        <button class="btn rej" disabled=${busy} onClick=${() => decide("rejected")}>❌ 반려</button>
      </div>
    </div>
  </div>`;
}

function ReviewPage({ review, reload }) {
  const [name, setName] = useState(localStorage.getItem("ves_name") || "");
  const [msg, setMsg] = useState(null);
  const onDecide = async (item, decision, note) => {
    const r = await fetch(BASE + "/api/decision", {
      method: "POST",
      headers: { "x-ves-key": encodeURIComponent(KEY()), "content-type": "application/json" },
      body: JSON.stringify({ clip_id: item.clip_id, decision, note: note || null, decided_by: name || null }),
    });
    const d = await r.json();
    if (!r.ok || d.error) { setMsg("기록 실패: " + (d.error || r.status)); return; }
    setMsg((decision === "approved" ? "✅ 합격" : "❌ 반려") + " 기록됨 — " + (item.channel || "") +
      (decision === "approved" ? " · 10분 내 발행 픽업 예정(4단계 적용 후)" : " · 대기 슬롯 해제"));
    reload();
  };
  const queue = review?.queue ?? [];
  const decided = review?.decided ?? [];
  return html`<div class="page">
    <div class="topbar"><h2>검수함</h2>
      <span class="sub">보고 → 누르면 끝. 결정은 DB(review_decisions)에 기록됩니다</span>
      <span style=${{ marginLeft: "auto", display: "flex", gap: "8px", alignItems: "center", fontSize: "12px", color: "var(--ink3)" }}>
        검수자 <input class="namebox" placeholder="이름(결정에 기록)" value=${name}
          onChange=${(e) => { setName(e.target.value); localStorage.setItem("ves_name", e.target.value); }} /></span>
    </div>
    ${msg ? html`<p class="note">${msg}</p>` : null}
    ${!review ? html`<div class="skel">불러오는 중…</div>`
      : queue.length === 0 ? html`<p class="note">검수 대기 중인 클립이 없습니다 — 밤 생성 후 자동으로 올라옵니다.</p>`
      : html`<div class="rgrid">${queue.map((i) => html`<${ReviewCard} key=${i.clip_id} item=${i} onDecide=${onDecide} />`)}</div>`}
    ${decided.length ? html`<div class="panel" style=${{ marginTop: "20px" }}>
      <h3>최근 결정 ${decided.length}건</h3>
      ${decided.map((d) => html`<div class="decided-row" key=${d.clip_id}>
        <span class=${"dpill " + d.decision.decision}>${d.decision.decision === "approved" ? "합격" : "반려"}</span>
        <span style=${{ flex: 1 }}>${d.title || d.clip_id} <span style=${{ color: "var(--ink3)", fontSize: "11px" }}>· ${d.channel || ""}</span></span>
        ${d.decision.note ? html`<span style=${{ color: "var(--ink3)", fontSize: "11px" }}>"${d.decision.note}"</span>` : null}
        <span style=${{ color: "var(--ink3)", fontSize: "11px" }}>${(d.decision.decided_at || "").slice(5, 16).replace("T", " ")}${d.decision.decided_by ? " · " + d.decision.decided_by : ""}</span>
      </div>`)}
    </div>` : null}
  </div>`;
}

// ── 커밋 · 배포 ──
function DeployPage({ machines, commits }) {
  // 기준 SHA: GitHub 최신(head) — 토큰 없으면 머신들 SHA 상호 비교(최다수)
  const heads = {};
  for (const key of ["brain", "aivideo"]) {
    const list = commits?.repos?.[key]?.commits;
    if (list?.length) { heads[key] = { sha: list[0].sha, shas: list.map((c) => c.sha) }; continue; }
    const counts = {};
    for (const m of machines) { const s = key === "brain" ? m.beat?.brain_sha : m.beat?.aivideo_sha; if (s) counts[s] = (counts[s] || 0) + 1; }
    const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    heads[key] = best ? { sha: best[0], shas: null } : null;
  }
  const compare = (sha, key) => {
    const h = heads[key];
    if (!sha || !h) return ["?", "old"];
    if (sha === h.sha) return ["✓ 최신", "ok"];
    if (h.shas) { const idx = h.shas.indexOf(sha); if (idx > 0) return [`✗ ${idx} 뒤`, "old"]; return ["✗ 15+ 뒤", "old"]; }
    return ["✗ 불일치", "old"];
  };
  return html`<div class="page">
    <div class="topbar"><h2>커밋 · 배포</h2><span class="sub">레포 최신 커밋 + 6대 pull 매트릭스</span></div>
    ${commits?.configured === false ? html`<p class="note">GITHUB_TOKEN 시크릿이 없어 커밋 목록은 비활성 — pull 매트릭스는 머신 간 상호 비교(다수결 SHA)로 동작 중입니다.</p>` : null}
    ${commits?.configured ? html`<div class="two-col">
      ${["brain", "aivideo"].map((key) => { const r = commits.repos[key]; return html`
        <div class="panel" key=${key}><h3>${r?.repo || key}</h3>
          ${r?.error ? html`<p class="note err">${r.error}</p>` : (r?.commits ?? []).slice(0, 6).map((c) => html`
            <div class="commit" key=${c.sha}><span class="sha">${shortSha(c.sha)}</span>
              <span class="msg">${c.message}</span>
              <span class="when">${(c.date || "").slice(5, 10)}</span></div>`)}
        </div>`; })}
    </div>` : null}
    <div class="panel"><h3>Pull 매트릭스</h3>
      <div class="tblw"><table><thead><tr><th>머신</th><th>brain</th><th></th><th>ai-video</th><th></th><th>보고</th></tr></thead>
        <tbody>${machines.map((m) => {
          const [bTxt, bCls] = compare(m.beat?.brain_sha, "brain");
          const [aTxt, aCls] = compare(m.beat?.aivideo_sha, "aivideo");
          return html`<tr key=${m.machine_id}>
            <td class="mac">${m.mac} <span style=${{ color: "var(--ink3)" }}>${m.machine_id}</span></td>
            <td class="sha">${shortSha(m.beat?.brain_sha)}</td><td class=${"sync " + (m.beat ? bCls : "old")}>${m.beat ? bTxt : "무보고"}</td>
            <td class="sha">${shortSha(m.beat?.aivideo_sha)}</td><td class=${"sync " + (m.beat ? aCls : "old")}>${m.beat ? aTxt : "무보고"}</td>
            <td>${m.beat ? new Date(m.beat.run_started_at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—"}</td>
          </tr>`; })}</tbody></table></div>
      <p class="note" style=${{ marginTop: "10px", marginBottom: 0 }}>SHA 는 각 머신이 <b>마지막 실행 시점</b>에 보고한 값 — 실행 사이에 pull 했다면 다음 실행에서 갱신됩니다.</p>
    </div>
  </div>`;
}

  const [ytConfigured, setYtConfigured] = useState(true);
  const [updated, setUpdated] = useState(null);

  const load = useCallback(async () => {
    const [f, m] = await Promise.all([api("/api/feed?days=60"), api("/api/machines")]);
    setFeed(f.items || []); setMx(m); setUpdated(new Date());
    api("/api/commits").then(setCommits).catch(() => null);
    api("/api/review").then(setReview).catch(() => null);
    // 공개상태: 피드 + 검수큐의 video_id 합집합을 50개씩
    const ids = [...new Set([...(f.items || []).map((x) => x.video_id), ...(m.queue || []).map((q) => q.video_id)].filter(Boolean))];
    for (let i = 0; i < ids.length; i += 50) {
      try {
        const d = await api("/api/ytstatus?ids=" + ids.slice(i, i + 50).join(","));
        if (d.configured === false) { setYtConfigured(false); break; }
        setYt((prev) => ({ ...prev, ...d.statuses }));
      } catch { break; }
    }
  }, []);

  useEffect(() => {
    if (!KEY()) { setAuthed(false); return; }
    api("/api/feed?days=1").then(() => setAuthed(true)).catch((e) => setAuthed(e.message === "unauthorized" || e.message === "setup" ? false : true));
  }, []);
  useEffect(() => {
    if (authed !== true) return;
    load();
    const t = setInterval(load, 5 * 60 * 1000);
    return () => clearInterval(t);
  }, [authed, load]);

  if (authed === null) return html`<div class="skel" style=${{ padding: "40px" }}>확인 중…</div>`;
  if (authed === false) return html`<${Login} onOk=${() => setAuthed(true)} />`;

  const machines = mx?.machines ?? [];
  const queue = mx?.queue ?? [];
  const reviewCount = queue.filter((q) => !q.stale && !q.unknown && (!q.video_id || (yt[q.video_id] && !["public", "gone"].includes(yt[q.video_id].privacy)))).length;

  return html`<div class="shell">
    <aside>
      <div class="brand"><h1>VES OPS</h1><div class="v">맥미니 6대 · 19채널 · React v2</div></div>
      <nav>${PAGES.map(([id, label]) => html`
        <a key=${id} class=${page === id ? "on" : ""} onClick=${() => setPage(id)}>${label}
          ${id === "review" && (review?.queue?.length ?? 0) ? html`<span class="cnt hot">${review.queue.length}</span>` : null}
          ${id === "feed" && feed.length ? html`<span class="cnt">${feed.length}</span>` : null}
        </a>`)}</nav>
      <div class="side-foot">
        <b style=${{ color: "var(--side-on)" }}>하트비트</b><br/>
        ${machines.map((m) => html`<span key=${m.machine_id} class=${m.beat ? "hb-ok" : "hb-bad"}>
          ● ${m.mac} ${m.beat ? ago(m.beat.run_started_at, mx?.now) : "무보고"}</span> `)}
        <br/><span class="hb-mut">갱신 ${updated ? updated.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) : "…"} · 5분마다 자동</span>
      </div>
    </aside>
    <main>
      ${page === "home" ? html`<${HomePage} machines=${machines} queue=${queue} yt=${yt} now=${mx?.now} />` : null}
      ${page === "review" ? html`<${ReviewPage} review=${review} reload=${() => api("/api/review").then(setReview).catch(() => null)} />` : null}
      ${page === "feed" ? html`<${FeedPage} feed=${feed} yt=${yt} ytConfigured=${ytConfigured} />` : null}
      ${page === "perf" ? html`<${PerfPage} />` : null}
      ${page === "machines" ? html`<${MachinesPage} machines=${machines} now=${mx?.now} anomalies=${mx?.anomalies ?? []} />` : null}
      ${page === "deploy" ? html`<${DeployPage} machines=${machines} commits=${commits} />` : null}
    </main>
  </div>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script></body></html>
